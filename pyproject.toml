[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba-backtest"
version = "0.1.0"
description = "Leakage-aware, reproducible horse-racing probability forecast evaluation"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
keiba-backtest = "keiba_backtest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
